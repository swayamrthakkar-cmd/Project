name: Build Flet iOS App
on: 
  workflow_dispatch: # Allows manual execution via GitHub CLI or Web

jobs:
  build-ios:
    runs-on: macos-latest  # Allocates a cloud-based macOS system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Flet App
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp  # Points the compiler inside your subfolder
