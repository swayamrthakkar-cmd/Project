
name: Build SwayChat IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS IPA
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp
          archive-output: false

      - name: Find IPA
        id: ipa
        shell: bash
        run: |
          IPA=$(find chatapp/build/ipa -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "No IPA was generated."
            echo "Build output:"
            find chatapp/build/ipa -maxdepth 5 -print
            exit 1
          fi

          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: swaychat-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
