
name: Build Flet iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flet iOS app
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp
          archive-output: true

      - name: Find and print iOS build file paths
        if: always()
        run: |
          echo "===== Searching chatapp/build ====="
          if [ -d "chatapp/build" ]; then
            find chatapp/build -type f -print
          else
            echo "chatapp/build does not exist"
          fi

          echo "===== Searching for IPA and ZIP files ====="
          find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            -type f \( -iname "*.ipa" -o -iname "*.zip" \) \
            -print 2>/dev/null || true

      - name: Upload iOS build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaychat-ios-build
          path: |
            chatapp/build/ipa/
            ${{ runner.temp }}/flet-build-action-archives/ipa/
          if-no-files-found: warn
