name: Build SwayChat IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS IPA
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp
          archive-output: false
          no-sign: true

      - name: Find and Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: swaychat-ipa
          # This pattern searches recursively through your entire repository 
          # for any file ending in .ipa, bypassing rigid path mistakes.
          path: "**/*.ipa"
          if-no-files-found: error
