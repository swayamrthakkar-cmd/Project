name: Build SwayChat IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS App Structure
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp
          archive-output: false
          no-sign: true

      - name: Manually Create Unsigned IPA File
        run: |
          # 1. Grab the exact output path from the Flet action step
          RAW_OUTPUT="${{ steps.build.outputs.output-path }}"
          echo "Flet raw output path is: $RAW_OUTPUT"
          
          # 2. Build the exact payload structure required for an .ipa
          mkdir -p Payload
          
          # 3. Copy the compiled .app directory into the Payload folder
          cp -r "$RAW_OUTPUT/"* Payload/ 2>/dev/null || cp -r "$RAW_OUTPUT" Payload/
          
          # 4. Compress the structure and name it explicitly as .ipa
          zip -r SwayChat.ipa Payload
          
          echo "Successfully generated SwayChat.ipa"

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: swaychat-ipa
          path: SwayChat.ipa
          if-no-files-found: error
