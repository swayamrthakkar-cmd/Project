
name: Build Flet iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flet iOS app
        uses: flet-dev/flet-build-action@v1
        with:
          target: ipa
          working-directory: chatapp
          archive-output: false

      - name: Find generated iOS files
        if: always()
        run: |
          echo "===== Searching repository ====="
          find "$GITHUB_WORKSPACE" -type f \
            \( -iname "*.ipa" -o -iname "*.zip" -o -name "Info.plist" \) \
            -print 2>/dev/null || true

          echo "===== Searching runner temporary directory ====="
          find "$RUNNER_TEMP" -type f \
            \( -iname "*.ipa" -o -iname "*.zip" -o -name "Info.plist" \) \
            -print 2>/dev/null || true

          echo "===== Searching for Xcode archives ====="
          find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" \
            -type d -name "*.xcarchive" \
            -print 2>/dev/null || true

      - name: Upload iOS build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaychat-ios-build
          path: |
            chatapp/build/
            ${{ runner.temp }}/flet-build-action-archives/
          if-no-files-found: warn
